<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sshblog</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      font: 16px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #0b0b0b; color: #e6e6e6;
    }
    main { max-width: 32rem; padding: 2rem; }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
    p { color: #a0a0a0; margin: 0.5rem 0 1.5rem; }
    code {
      display: block; padding: 1rem 1.25rem;
      background: #161616; border: 1px solid #262626; border-radius: 8px;
      color: #7dd3fc; font-size: 1.05rem;
    }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>sshblog</h1>
    <p>This site is read over SSH. Point your terminal here:</p>
    <code>ssh example.com</code>
    <p>No account needed &mdash; just connect. Prefer a feed reader?
       Subscribe to the <a href="/rss.xml">RSS feed</a>.</p>
  </main>
</body>
</html>
