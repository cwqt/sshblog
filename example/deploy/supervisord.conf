[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# The SSH blog. Working dir holds sshblog.yaml, posts/, and .ssh/ (host key).
[program:sshblog]
command=/usr/local/bin/sshblog
directory=/app
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Static landing page + rss.xml over HTTP.
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
