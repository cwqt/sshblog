worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 8080;
        server_name _;
        root /var/www/html;
        index index.html;

        # RSS feed generated at build time by `sshblog -gen-feed`. Served with
        # the proper content-type (stock mime.types would label .xml text/xml).
        location = /rss.xml {
            default_type application/rss+xml;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
